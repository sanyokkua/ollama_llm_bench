tasks:
  - task_id: "text_operations_proofreading_english"
    category: "Text Operations"
    sub_category: "Proofreading"
    task_type: text_rewrite
    difficulty: easy
    response_scope: contains
    question: |
      Proofread the following text for grammar, word ordering, and spelling errors:

      helo, need i help from you today so come here and let s dot it together to not postpone till romorrow.
    golden_answer: "Hello, I need help from you today, so come here and let's do it together so we don't postpone it until tomorrow."
    pass_criteria: "All spelling errors corrected (helo→Hello, romorrow→tomorrow, dot→do). Grammar and word order fixed. Meaning preserved."
    fail_criteria: "Spelling errors left uncorrected. Grammar or word order issues remain. Meaning changed."
    required_terms:
      exact:
        - "tomorrow"
        - "Hello"
      semantic:
        - "help"
        - "together"
        - "postpone"
      forbidden:
        - "helo"
        - "romorrow"
        - "dot it"
