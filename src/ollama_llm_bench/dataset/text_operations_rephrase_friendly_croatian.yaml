tasks:
  - task_id: "text_operations_rephrase_friendly_croatian"
    category: "Text Operations"
    sub_category: "Rephrase"
    task_type: text_rewrite
    difficulty: medium
    response_scope: covers
    question: |
      Preformulirajte sljedeću rečenicu u prijateljskom tonu, zadržavajući smisao:
      Moj, tim zajdno s mnom planiruje predstavyti inovativniy proizvod, koji se, očikuje da će značajno utecati na tržišnu situacije veći sljedeći tedan.
    golden_answer: "S nestrpljenjem iščekujemo priliku da vam predstavimo naš novi inovativni proizvod, koji bi mogao stvarno promijeniti tržište već sljedeći tjedan!"
    pass_criteria: "Warm and friendly Croatian tone. Grammar correct. Core meaning preserved: team excited to present product that may impact the market next week."
    fail_criteria: "Too formal or cold. Grammar errors. Key meaning changed or lost."
    required_terms:
      exact: []
      semantic:
        - "inovativni proizvod"
        - "tržište"
        - "tjedan"
      forbidden:
        - "zajdno"
        - "planiruje"
        - "inovativniy"
