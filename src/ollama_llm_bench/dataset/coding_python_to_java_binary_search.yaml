tasks:
  - task_id: "coding_python_to_java_binary_search"
    category: "Coding"
    sub_category: "Code Conversion"
    task_type: code_generation
    difficulty: medium
    response_scope: covers
    question: |
      Convert the following Python function to Java 21.
      Preserve the logic exactly, but add correct Java types and idiomatic syntax.
      The Java method should be able to search an `int[]` array recursively,
      returning the index if found, or `-1` if not.

      ```python
      def binarySearch(needle, haystack, left=None, right=None):
          if left is None:
              left = 0
          if right is None:
              right = len(haystack) - 1
          print('Searching:', haystack[left:right + 1])
          if left > right:
              return None
          mid = (left + right) // 2
          if needle == haystack[mid]:
              return mid
          elif needle < haystack[mid]:
              return binarySearch(needle, haystack, left, mid - 1)
          elif needle > haystack[mid]:
              return binarySearch(needle, haystack, mid + 1, right)
      ```
    golden_answer: |
      public static int binarySearch(int needle, int[] haystack, Integer left, Integer right) {
          if (left == null) {
              left = 0;
          }
          if (right == null) {
              right = haystack.length - 1;
          }
          System.out.println("Searching: " + java.util.Arrays.toString(
              java.util.Arrays.copyOfRange(haystack, left, right + 1)
          ));
          if (left > right) {
              return -1;
          }
          int mid = (left + right) / 2;
          if (needle == haystack[mid]) {
              return mid;
          } else if (needle < haystack[mid]) {
              return binarySearch(needle, haystack, left, mid - 1);
          } else {
              return binarySearch(needle, haystack, mid + 1, right);
          }
      }
    pass_criteria: "Mirrors the recursive binary search logic from the Python code. Correctly handles null left/right parameters using Integer wrapper type. Uses int[] for the array. Prints the searched range. Returns -1 if not found."
    fail_criteria: "Changes the algorithm to iterative without preserving the recursive structure. Ignores null handling for left/right. Uses wrong index calculations. Writes code that will not compile in Java."
    required_terms:
      exact:
        - "Integer"
        - "binarySearch"
      semantic:
        - "recursive"
        - "null check"
      forbidden:
        - "while ("
