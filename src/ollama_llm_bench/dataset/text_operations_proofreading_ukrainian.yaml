tasks:
  - task_id: "text_operations_proofreading_ukrainian"
    category: "Text Operations"
    sub_category: "Proofreading"
    task_type: text_rewrite
    difficulty: easy
    response_scope: contains
    question: |
      Виправте граматичні, стилістичні та пунктуаційні помилки у наступному реченні:
      Моя комманда разом зі мноб планує презинтувати інноваційний продукт який як очекується суттєво впліне на конюнктуру рінку вже наступного тижня.
    golden_answer: "Моя команда разом зі мною планує презентувати інноваційний продукт, який, як очікується, суттєво вплине на кон'юнктуру ринку вже наступного тижня."
    pass_criteria: "Spelling corrected (комманда→команда, мноб→мною, презинтувати→презентувати, очекується→очікується, впліне→вплине, рінку→ринку). Punctuation added correctly. Meaning preserved."
    fail_criteria: "Spelling errors remain. Missing commas for clause separation. Changed meaning or omitted content."
    required_terms:
      exact:
        - "команда"
        - "мною"
        - "презентувати"
      semantic:
        - "інноваційний продукт"
        - "ринок"
      forbidden:
        - "комманда"
        - "мноб"
        - "презинтувати"
        - "очекується"
