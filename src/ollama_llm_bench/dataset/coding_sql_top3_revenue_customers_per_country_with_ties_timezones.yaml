tasks:
  - task_id: "coding_sql_top3_revenue_customers_per_country_with_ties_timezones"
    category: "Coding"
    sub_category: "SQL"
    task_type: code_generation
    difficulty: hard
    response_scope: covers
    question: |
      Generate a report showing the TOP 3 HIGHEST-REVENUE CUSTOMERS per COUNTRY
      for the LAST 30 DAYS from the CEO's local midnight (CEO is in New York / America/New_York).
      Requirements:
        - Include ties (if multiple customers tie for 3rd place, show all of them).
        - Exclude cancelled orders and inactive products.
        - Handle orphaned orders (missing customer rows) without failing — place them under country "Unknown".
        - Ignore order items with NULL price.
        - `order_date` is stored in UTC; the 30-day window should start at CEO's local midnight 30 days ago converted to UTC.
        - Results sorted by country → revenue rank → customer name.
        - Must be performant for large tables (10M+ orders). Include indexing notes.
      Target engine: PostgreSQL.
    golden_answer: |
      WITH params AS (
        SELECT
          ((date_trunc('day', now() AT TIME ZONE 'America/New_York') - INTERVAL '30 days')
           AT TIME ZONE 'America/New_York') AS start_utc
      ),
      valid_items AS (
        SELECT oi.order_id, (oi.quantity * oi.price)::numeric AS line_revenue
        FROM order_items oi
        JOIN products p ON p.id = oi.product_id
        WHERE p.is_active = TRUE AND oi.price IS NOT NULL
      ),
      recent_orders AS (
        SELECT o.id AS order_id, o.customer_id
        FROM orders o
        CROSS JOIN params
        WHERE o.status = 'completed'
          AND o.order_date >= params.start_utc
          AND o.order_date < now() AT TIME ZONE 'UTC'
      ),
      customer_revenue AS (
        SELECT
          COALESCE(c.country, 'Unknown') AS country,
          COALESCE(c.id, -1) AS customer_id,
          COALESCE(c.name, 'Unknown') AS customer_name,
          SUM(vi.line_revenue) AS revenue
        FROM recent_orders o
        JOIN valid_items vi ON vi.order_id = o.order_id
        LEFT JOIN customers c ON c.id = o.customer_id
        GROUP BY COALESCE(c.country, 'Unknown'), COALESCE(c.id, -1), COALESCE(c.name, 'Unknown')
      ),
      ranked AS (
        SELECT country, customer_id, customer_name, revenue,
               RANK() OVER (PARTITION BY country ORDER BY revenue DESC) AS revenue_rank
        FROM customer_revenue
      )
      SELECT country, revenue_rank, customer_id, customer_name, revenue
      FROM ranked
      WHERE revenue_rank <= 3
      ORDER BY country, revenue_rank, customer_name;
      -- Indexes: (status, order_date), (order_date, customer_id), order_items(order_id), products(is_active), customers(country)
    pass_criteria: "Correctly computes the 30-day UTC window from CEO's local midnight. Aggregates revenue excluding cancelled orders, inactive products, and NULL prices. Uses RANK() (not ROW_NUMBER()) to preserve ties. Returns all rows where rank <= 3. Handles missing customers via LEFT JOIN and COALESCE. Sorted by country, rank, name."
    fail_criteria: "Uses server local time without timezone conversion. Uses ROW_NUMBER() or LIMIT 3 breaking ties. Does not exclude cancelled orders or inactive products. INNER JOIN drops orphaned orders. No performance considerations."
    required_terms:
      exact:
        - "RANK()"
        - "PARTITION BY"
        - "LEFT JOIN"
        - "COALESCE"
        - "America/New_York"
      semantic:
        - "window function"
        - "timezone conversion"
      forbidden:
        - "ROW_NUMBER()"
        - "LIMIT 3"
