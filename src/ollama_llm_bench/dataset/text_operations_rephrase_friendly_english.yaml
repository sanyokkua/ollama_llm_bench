tasks:
  - task_id: "text_operations_rephrase_friendly_english"
    category: "Text Operations"
    sub_category: "Rephrase"
    task_type: text_rewrite
    difficulty: medium
    response_scope: covers
    question: |
      Rephrase the following text into a friendly tone while correcting grammar and word order:

      Me and my team is excited to presents the quarterly results. We wants to discusses how this effects the bottom line for next quarter. Please finds time for meeting us.
    golden_answer: "My team and I are excited to share the quarterly results with you. We'd love to chat about how this impacts the bottom line for next quarter. Please let us know when you have time to meet."
    pass_criteria: "Warm, friendly tone. Grammar corrected. Covers: sharing excitement about quarterly results, discussing bottom line impact, inviting a meeting."
    fail_criteria: "Too formal or too casual. Grammar errors not fixed. Missing warmth or the meeting invitation."
    required_terms:
      exact: []
      semantic:
        - "quarterly results"
        - "next quarter"
        - "meet"
      forbidden:
        - "Me and my team is excited to presents"
        - "We wants to discusses"
        - "Please finds time"
