tasks:
  - task_id: "text_operations_translation_ukrainian_to_croatian"
    category: "Text Operations"
    sub_category: "Translation"
    task_type: translation
    difficulty: easy
    response_scope: contains
    source_language: uk
    target_language: hr
    question: |
      Prevedite sljedeći tekst na hrvatski:
      Добрий день. Я хотів би дізнатися чи можу зняти готівку з банківської карти? Потрібно зняти з картки тисячу двісті сімдесят девʼять євро.
    golden_answer: "Dobar dan. Želio bih znati mogu li podići gotovinu s bankovne kartice? Trebam podići s kartice tisuću dvjesto sedamdeset devet eura."
    pass_criteria: "Translated into Croatian. Key details preserved: polite greeting, question about withdrawing cash from bank card, amount of 1279 euros."
    fail_criteria: "Translation inaccurate or not in Croatian. Amount or currency incorrect. Important information omitted."
    required_terms:
      exact:
        - "1279"
      semantic:
        - "gotovina"
        - "kartica"
        - "podići"
      forbidden: []
