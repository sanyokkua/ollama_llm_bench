tasks:
  - task_id: "general_knowledge_literature_orwell_1984"
    category: "General Knowledge"
    sub_category: "Literature"
    task_type: factual_qa
    difficulty: easy
    response_scope: contains
    question: |
      What historical events inspired George Orwell's "1984," and what specific year did Orwell complete writing the novel, according to his published correspondence?
    golden_answer: "George Orwell's '1984' was inspired by the totalitarian regimes of Nazi Germany and Stalinist Soviet Union. Orwell completed writing the novel in 1948, as confirmed by his published letters."
    pass_criteria: "Identifies totalitarian regimes (Nazi Germany and/or Stalinist Soviet Union) as inspiration. States the correct completion year of 1948."
    fail_criteria: "Incorrect inspiration sources (e.g., only one regime or unrelated events). Wrong completion year. Confusing with other Orwell works like Animal Farm."
    required_terms:
      exact:
        - "1948"
      semantic:
        - "totalitarian"
        - "Stalin"
      forbidden: []
