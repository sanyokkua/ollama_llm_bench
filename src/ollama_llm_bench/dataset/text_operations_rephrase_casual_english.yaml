tasks:
  - task_id: "text_operations_rephrase_casual_english"
    category: "Text Operations"
    sub_category: "Rephrase"
    task_type: text_rewrite
    difficulty: medium
    response_scope: covers
    question: |
      Rephrase the following text into a casual tone while correcting grammar and word order:

      Me and my team is excited to presents the quarterly results. We wants to discusses how this effects the bottom line for next quarter. Please finds time for meeting us.
    golden_answer: "My team's got the quarterly results ready – we should chat about how this affects next quarter's numbers. Got time for a quick meeting?"
    pass_criteria: "Grammar corrected. Casual informal tone used throughout. Discusses quarterly results and requests a meeting. Does not copy the original grammatically incorrect phrasing."
    fail_criteria: "Retains formal language. Grammar errors not corrected. Does not invite a meeting. Copies the original text verbatim."
    required_terms:
      exact: []
      semantic:
        - "quarterly results"
        - "meeting"
        - "next quarter"
      forbidden:
        - "Me and my team is excited to presents"
        - "We wants to discusses"
        - "Please finds time"
