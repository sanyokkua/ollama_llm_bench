tasks:
  - task_id: "text_operations_rephrase_semi_formal_english"
    category: "Text Operations"
    sub_category: "Rephrase"
    task_type: text_rewrite
    difficulty: medium
    response_scope: covers
    question: |
      Rephrase the following text into a semi-formal tone while correcting grammar and word order:

      Me and my team is excited to presents the quarterly results. We wants to discusses how this effects the bottom line for next quarter. Please finds time for meeting us.
    golden_answer: "My team and I have prepared the quarterly results and would appreciate discussing how they impact next quarter's bottom line. Could you please find time for a meeting?"
    pass_criteria: "Semi-formal, polite tone. Grammar corrected. Covers: presenting quarterly results, discussing impact on bottom line, requesting a meeting."
    fail_criteria: "Overly formal or too casual. Grammar not corrected. Missing meeting request or bottom line discussion."
    required_terms:
      exact: []
      semantic:
        - "quarterly results"
        - "bottom line"
        - "meeting"
      forbidden:
        - "Me and my team is excited to presents"
        - "We wants to discusses"
        - "Please finds time"
