tasks:
  - task_id: "text_operations_rephrase_formal_croatian"
    category: "Text Operations"
    sub_category: "Rephrase"
    task_type: text_rewrite
    difficulty: medium
    response_scope: covers
    question: |
      Preformulirajte sljedeću rečenicu u formalnom stilu, zadržavajući sve važne informacije:
      Moj, tim zajdno s mnom planiruje predstavyti inovativniy proizvod, koji se, očikuje da će značajno utecati na tržišnu situacije veći sljedeći tedan.
    golden_answer: "Naš tim u suradnji sa mnom namjerava prezentirati inovativni proizvod koji, prema procjenama, značajno će utjecati na tržišnu situaciju već sljedeći tjedan."
    pass_criteria: "Formal Croatian style. All important information preserved: team, innovative product, market impact, next week timeline. Grammar correct."
    fail_criteria: "Informal language. Grammar errors. Key information omitted or meaning changed."
    required_terms:
      exact: []
      semantic:
        - "inovativni proizvod"
        - "tržište"
        - "tjedan"
      forbidden:
        - "zajdno"
        - "planiruje"
        - "inovativniy"
