tasks:
  - task_id: "text_operations_proofreading_forbidden_word_filter"
    category: "Text Operations"
    sub_category: "Proofreading"
    task_type: text_rewrite
    difficulty: easy
    response_scope: contains
    question: |
      Rewrite this sentence without using the words 'very', 'really', or 'actually', and without changing meaning:
      'This is actually a very important meeting that will really impact Q3 results.'
    golden_answer: "This is a critical meeting that will significantly impact Q3 results."
    pass_criteria: "None of the forbidden words ('very', 'really', 'actually') appear. Meaning of an important meeting affecting Q3 results is preserved."
    fail_criteria: "Uses any of the forbidden words. Changes the original meaning. Adds unrelated information."
    required_terms:
      exact: []
      semantic:
        - "meeting"
        - "Q3"
        - "impact"
      forbidden:
        - "very"
        - "really"
        - "actually"
