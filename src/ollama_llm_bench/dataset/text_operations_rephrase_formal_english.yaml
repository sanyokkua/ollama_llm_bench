tasks:
  - task_id: "text_operations_rephrase_formal_english"
    category: "Text Operations"
    sub_category: "Rephrase"
    task_type: text_rewrite
    difficulty: medium
    response_scope: covers
    question: |
      Rephrase the following text into a formal tone while correcting grammar and word order:

      Me and my team is excited to presents the quarterly results. We wants to discusses how this effects the bottom line for next quarter. Please finds time for meeting us.
    golden_answer: "My team and I are pleased to present the quarterly financial results. We request the opportunity to discuss their implications for next quarter's bottom line. Kindly schedule a meeting at your earliest convenience."
    pass_criteria: "Formal tone throughout. Grammar fully corrected. Covers: presenting quarterly results, discussing bottom line impact, requesting a formal meeting."
    fail_criteria: "Informal language retained. Grammar errors not corrected. Missing formal tone adaptation or the meeting request."
    required_terms:
      exact: []
      semantic:
        - "quarterly results"
        - "bottom line"
        - "meeting"
      forbidden:
        - "Me and my team is excited to presents"
        - "We wants to discusses"
        - "Please finds time"
