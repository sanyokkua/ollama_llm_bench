tasks:
  - task_id: "text_operations_rephrase_semi_formal_ukrainian"
    category: "Text Operations"
    sub_category: "Rephrase"
    task_type: text_rewrite
    difficulty: medium
    response_scope: covers
    question: |
      Перефразуйте наступне речення у напівформальному стилі, зберігаючи важливі деталі:
      Моя комманда разом зі мноб планує презинтувати інноваційний продукт який як очекується суттєво впліне на конюнктуру рінку вже наступного тижня.
    golden_answer: "Ми з командою збираємось представити інноваційний продукт, який, за прогнозами, матиме значний вплив на ринок уже наступного тижня."
    pass_criteria: "Semi-formal Ukrainian tone. Grammar corrected. Core meaning preserved: team presenting innovative product expected to impact the market next week."
    fail_criteria: "Too formal or too colloquial. Original errors retained. Meaning changed or important details missing."
    required_terms:
      exact: []
      semantic:
        - "команда"
        - "інноваційний продукт"
        - "ринок"
      forbidden:
        - "комманда"
        - "мноб"
        - "презинтувати"
