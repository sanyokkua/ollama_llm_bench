tasks:
  - task_id: "text_operations_rephrase_direct_croatian"
    category: "Text Operations"
    sub_category: "Rephrase"
    task_type: text_rewrite
    difficulty: medium
    response_scope: covers
    question: |
      Preformulirajte sljedeću rečenicu u direktnom, jasnom tonu, zadržavajući značenje:
      Moj, tim zajdno s mnom planiruje predstavyti inovativniy proizvod, koji se, očikuje da će značajno utecati na tržišnu situacije veći sljedeći tedan.
    golden_answer: "Moj tim i ja predstavit ćemo inovativni proizvod sljedeći tjedan koji će promijeniti tržište."
    pass_criteria: "Direct and concise phrasing. Correct Croatian grammar. Communicates the product launch and market impact clearly."
    fail_criteria: "Overly complex or vague expressions. Grammar errors. Meaning changed."
    required_terms:
      exact: []
      semantic:
        - "inovativni proizvod"
        - "tržište"
        - "tjedan"
      forbidden:
        - "zajdno"
        - "planiruje"
        - "inovativniy"
