tasks:
  - task_id: "data_extraction_transformation_data_type_inference"
    category: "Data Extraction and Transformation"
    sub_category: "CSV to JSON"
    task_type: data_extraction
    difficulty: medium
    response_scope: covers
    question: |
      Given the following CSV input, convert it to JSON with proper data type inference.
      Additionally, identify and document type assumptions for these fields:
      - "Active" (boolean vs string vs integer)
      - "Score" (number vs string)
      - "Join Date" (format recognition)
      - "Tags" (array vs string)
      Provide confidence scores for each inference and include data quality metrics.

      ID,Name,Join Date,Active,Score,Tags
      1,John Doe,2020-01-15,true,95.5,a,b,c
      2,Jane Smith,2021-03-22,false,87.2,x,y
      3,Bob Johnson,2019-11-30,1,100.0,foo,bar,baz
    golden_answer: |
      {
        "data": [
          {"id": 1, "name": "John Doe", "joinDate": "2020-01-15", "active": true, "score": 95.5, "tags": ["a", "b", "c"]},
          {"id": 2, "name": "Jane Smith", "joinDate": "2021-03-22", "active": false, "score": 87.2, "tags": ["x", "y"]},
          {"id": 3, "name": "Bob Johnson", "joinDate": "2019-11-30", "active": true, "score": 100.0, "tags": ["foo", "bar", "baz"]}
        ],
        "metadata": {
          "fieldTypes": {
            "id": {"type": "integer", "confidence": 1.0},
            "name": {"type": "string", "confidence": 1.0},
            "joinDate": {"type": "date", "format": "YYYY-MM-DD", "confidence": 0.95},
            "active": {"type": "boolean", "confidence": 0.9},
            "score": {"type": "number", "confidence": 1.0},
            "tags": {"type": "array", "itemType": "string", "confidence": 0.85}
          },
          "dataQuality": {
            "missingValues": 0,
            "inconsistentTypes": 1,
            "warnings": ["Active field uses mixed representation (true/false and 1)"]
          }
        }
      }
    pass_criteria: "All rows converted to JSON with correct types: id as integer, active as boolean (including '1' converted to true), score as number, tags as array of strings, joinDate as ISO date string. Includes type inference documentation with confidence scores. Notes the mixed boolean representation for 'Active'. Data quality metrics included."
    fail_criteria: "Returns CSV or incomplete JSON. Does not infer types correctly (e.g., active as string). Leaves tags as a single string. No confidence scores or data quality metrics. Incorrect data types for numbers or dates."
    required_terms:
      exact:
        - "boolean"
        - "confidence"
      semantic:
        - "type inference"
        - "data quality"
      forbidden: []
