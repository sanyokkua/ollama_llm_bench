tasks:
  - task_id: "general_knowledge_literature_harry_potter_resurrection_object"
    category: "General Knowledge"
    sub_category: "Literature"
    task_type: factual_qa
    difficulty: medium
    response_scope: contains
    question: |
      In J.K. Rowling's original Harry Potter book series, what specific magical object did Harry Potter use to summon the spirits of his loved ones during the Battle of Hogwarts, and in which chapter did this occur?
    golden_answer: "Harry Potter used the Resurrection Stone, embedded in the first Golden Snitch he ever caught, to summon the spirits of his parents during the Battle of Hogwarts. This occurred in 'King's Cross,' the 35th chapter of 'Harry Potter and the Deathly Hallows.'"
    pass_criteria: "Identifies the Resurrection Stone as the magical object. Mentions the Golden Snitch connection. States the chapter 'King's Cross' in Deathly Hallows. Correctly identifies whose spirits were summoned."
    fail_criteria: "Incorrect magical object (e.g., Elder Wand, Invisibility Cloak). Wrong chapter or book. Confusing book events with the movie adaptation."
    required_terms:
      exact:
        - "Resurrection Stone"
        - "King's Cross"
      semantic:
        - "Deathly Hallows"
        - "Golden Snitch"
      forbidden:
        - "Elder Wand"
        - "Invisibility Cloak"
