tasks:
  - task_id: "general_knowledge_ai_transformer"
    category: "General Knowledge"
    sub_category: "AI"
    task_type: factual_qa
    difficulty: easy
    response_scope: contains
    question: |
      What specific architectural innovation distinguishes the Transformer model from previous sequence models, and in what exact month and year was the seminal "Attention is All You Need" paper published?
    golden_answer: "The Transformer architecture replaces recurrent and convolutional layers with a self-attention mechanism, enabling parallel processing of sequence data. The paper 'Attention is All You Need' was published in June 2017."
    pass_criteria: "Mentions self-attention mechanism as the key innovation. States that recurrent layers are replaced. Gives the correct publication date of June 2017."
    fail_criteria: "Confuses self-attention with other mechanisms (e.g., cross-attention, convolution). States incorrect publication date. Does not identify self-attention as the distinguishing innovation."
    required_terms:
      exact:
        - "self-attention"
        - "June 2017"
      semantic:
        - "parallel processing"
        - "attention mechanism"
      forbidden: []
