tasks:
  - task_id: "data_extraction_transformation_structured_data_extraction"
    category: "Data Extraction and Transformation"
    sub_category: "Text"
    task_type: data_extraction
    difficulty: easy
    response_scope: exact
    question: |
      From this text, extract ONLY the invoice number and date in format 'INV-XXXXX, YYYY-MM-DD':
      'Hello team! Per our call, attached is invoice INV-78342 dated 2023-11-15. Note: Payment terms changed to net 45 (was net 30). Let me know if you need anything else! -Sarah'
    golden_answer: "INV-78342, 2023-11-15"
    pass_criteria: "Output is exactly 'INV-78342, 2023-11-15' — the invoice number followed by a comma and space followed by the ISO date. No additional text."
    fail_criteria: "Includes extra information beyond invoice number and date. Extracts wrong values. Uses incorrect format. Adds explanation text."
    required_terms:
      exact:
        - "INV-78342"
        - "2023-11-15"
      semantic: []
      forbidden:
        - "Note:"
        - "Payment terms"
        - "net 45"
