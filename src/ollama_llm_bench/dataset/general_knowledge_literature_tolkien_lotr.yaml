tasks:
  - task_id: "general_knowledge_literature_tolkien_lotr"
    category: "General Knowledge"
    sub_category: "Literature"
    task_type: factual_qa
    difficulty: hard
    response_scope: contains
    question: |
      What was the original title consideration for "The Lord of the Rings" that J.R.R. Tolkien later abandoned, and what linguistic reason did he give for rejecting it in his letters?
    golden_answer: "Tolkien initially considered the title 'The New Shadow' for a sequel to 'The Lord of the Rings,' but later abandoned it, citing that it lacked the gravitas and mythic quality needed and was linguistically unsuitable to represent the epic's scope."
    pass_criteria: "Identifies 'The New Shadow' as the abandoned title. Explains that Tolkien rejected it due to its failure to convey the mythic or epic tone required for the work."
    fail_criteria: "Confuses 'The New Shadow' with the actual LotR title. Gives unrelated reasons for title rejection. States it was a title for the original trilogy rather than a sequel concept."
    required_terms:
      exact:
        - "The New Shadow"
      semantic:
        - "mythic quality"
        - "abandoned"
      forbidden: []
