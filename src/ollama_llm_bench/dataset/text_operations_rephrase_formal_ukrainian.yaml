tasks:
  - task_id: "text_operations_rephrase_formal_ukrainian"
    category: "Text Operations"
    sub_category: "Rephrase"
    task_type: text_rewrite
    difficulty: medium
    response_scope: covers
    question: |
      Перефразуйте наступне речення у формальному стилі, зберігаючи всі значущі деталі:
      Моя комманда разом зі мноб планує презинтувати інноваційний продукт який як очекується суттєво впліне на конюнктуру рінку вже наступного тижня.
    golden_answer: "Наша команда у співпраці зі мною має намір здійснити презентацію інноваційного продукту, який, згідно з прогнозами, матиме значний вплив на кон'юнктуру ринку вже наступного тижня."
    pass_criteria: "Formal Ukrainian register. All details preserved: team, product presentation, market impact, next week. Grammar corrected."
    fail_criteria: "Colloquial language. Spelling errors retained. Missing important details or meaning changed."
    required_terms:
      exact: []
      semantic:
        - "команда"
        - "інноваційний продукт"
        - "ринок"
      forbidden:
        - "комманда"
        - "мноб"
        - "презинтувати"
