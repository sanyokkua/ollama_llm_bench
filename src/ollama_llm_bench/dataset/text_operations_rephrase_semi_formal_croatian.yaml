tasks:
  - task_id: "text_operations_rephrase_semi_formal_croatian"
    category: "Text Operations"
    sub_category: "Rephrase"
    task_type: text_rewrite
    difficulty: medium
    response_scope: covers
    question: |
      Preformulirajte sljedeću rečenicu u poluformalnom stilu, zadržavajući ključne informacije:
      Moj, tim zajdno s mnom planiruje predstavyti inovativniy proizvod, koji se, očikuje da će značajno utecati na tržišnu situacije veći sljedeći tedan.
    golden_answer: "Moj tim i ja planiramo predstaviti inovativni proizvod koji bi, prema očekivanjima, mogao značajno utjecati na tržište već sljedeći tjedan."
    pass_criteria: "Semi-formal, polite Croatian tone. Grammar corrected. Core meaning preserved: team planning to present product expected to impact market next week."
    fail_criteria: "Too formal or too informal. Grammar errors present. Key information missing."
    required_terms:
      exact: []
      semantic:
        - "inovativni proizvod"
        - "tržište"
        - "tjedan"
      forbidden:
        - "zajdno"
        - "planiruje"
        - "inovativniy"
