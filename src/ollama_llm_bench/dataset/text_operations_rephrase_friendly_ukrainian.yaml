tasks:
  - task_id: "text_operations_rephrase_friendly_ukrainian"
    category: "Text Operations"
    sub_category: "Rephrase"
    task_type: text_rewrite
    difficulty: medium
    response_scope: covers
    question: |
      Перефразуйте наступне речення у дружньому тоні, зберігаючи зміст:
      Моя комманда разом зі мноб планує презинтувати інноваційний продукт який як очекується суттєво впліне на конюнктуру рінку вже наступного тижня.
    golden_answer: "Ми з командою з нетерпінням чекаємо можливості поділитися з вами нашим новим інноваційним продуктом, який, як передбачається, сильно змінить ринок уже наступного тижня!"
    pass_criteria: "Warm, friendly Ukrainian tone. Grammar corrected. Core meaning preserved: team eager to present innovative product expected to change the market next week."
    fail_criteria: "Too formal or dry. Original errors retained. Content or meaning changed."
    required_terms:
      exact: []
      semantic:
        - "команда"
        - "інноваційний продукт"
        - "ринок"
      forbidden:
        - "комманда"
        - "мноб"
        - "презинтувати"
