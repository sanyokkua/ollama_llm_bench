tasks:
  - task_id: "text_operations_proofreading_croatian"
    category: "Text Operations"
    sub_category: "Proofreading"
    task_type: text_rewrite
    difficulty: easy
    response_scope: contains
    question: |
      Ispravite gramatičke, stilističke i interpunkcijske pogreške u sljedećoj rečenici:
      Moj, tim zajdno s mnom planiruje predstavyti inovativniy proizvod, koji se, očikuje da će značajno utecati na tržišnu situacije veći sljedeći tedan.
    golden_answer: "Moj tim zajedno sa mnom planira predstaviti inovativni proizvod koji se očekuje da će značajno utjecati na tržišnu situaciju već sljedeći tjedan."
    pass_criteria: "All spelling errors corrected (zajdno→zajedno, planiruje→planira, predstavyti→predstaviti, utecati→utjecati, tržišnu situacije→tržišnu situaciju, tedan→tjedan). Punctuation fixed. Meaning preserved."
    fail_criteria: "Spelling errors remain. Incorrect punctuation left. Meaning changed or key information missing."
    required_terms:
      exact:
        - "inovativni proizvod"
        - "tjedan"
      semantic:
        - "tržište"
        - "planira"
      forbidden:
        - "zajdno"
        - "planiruje"
        - "predstavyti"
