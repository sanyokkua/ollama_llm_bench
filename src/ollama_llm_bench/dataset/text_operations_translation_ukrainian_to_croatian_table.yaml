tasks:
  - task_id: "text_operations_translation_ukrainian_to_croatian_table"
    category: "Text Operations"
    sub_category: "Translation"
    task_type: translation
    difficulty: medium
    response_scope: covers
    source_language: uk
    target_language: hr
    question: |
      Prevedite sljedeće riječi i fraze s ukrajinskog na hrvatski. Rezultat predstavite u tablici s stupcima: Izvorna riječ/fraza, Prevedena riječ/fraza, Primjer upotrebe:

      - Добрий день
      - Хотів би дізнатися статус обробки мої документів
      - Документ
      - Документи
      - Статус
      - Розгляд
      - Статус розгляду
      - Статус розгляду документів
      - Коли я зможу дізнатися результат розгляду документів
      - До кого я можу звернутися із запитанням щодо статусу розгляду документів
    golden_answer: |
      | Izvorna riječ/fraza | Prevedena riječ/fraza | Primjer upotrebe |
      |---|---|---|
      | Добрий день | Dobar dan | Dobar dan, kako vam mogu pomoći? |
      | Хотів би дізнатися статус обробки мої документів | Želio bih saznati status obrade mojih dokumenata | Želio bih saznati status obrade mojih dokumenata. |
      | Документ | Dokument | Molim vas, pošaljite mi taj dokument. |
      | Документи | Dokumenti | Svi dokumenti su predani na vrijeme. |
      | Статус | Status | Trenutni status vaše prijave je u obradi. |
      | Розгляд | Razmatranje | Razmatranje zahtjeva traje nekoliko dana. |
      | Статус розгляду | Status razmatranja | Molim vas, obavijestite me o statusu razmatranja. |
      | Статус розгляду документів | Status razmatranja dokumenata | Provjeravam status razmatranja dokumenata. |
      | Коли я зможу дізнатися результат розгляду документів | Kada ću moći saznati rezultat razmatranja dokumenata | Kada ću moći saznati rezultat razmatranja dokumenata? |
      | До кого я можу звернутися із запитанням щодо статусу розгляду документів | Kome se mogu obratiti s pitanjem o statusu razmatranja dokumenata | Kome se mogu obratiti s pitanjem o statusu razmatranja dokumenata? |
    pass_criteria: "All 10 phrases translated into Croatian. Table format with 3 columns (original, translation, usage example). Translations accurate and in Croatian."
    fail_criteria: "Translation not in Croatian. Table format missing or incorrect. Translations inaccurate or usage examples missing."
    required_terms:
      exact:
        - "Dobar dan"
        - "Dokument"
        - "Status"
      semantic:
        - "razmatranje"
        - "dokumenti"
        - "tablica"
      forbidden: []
