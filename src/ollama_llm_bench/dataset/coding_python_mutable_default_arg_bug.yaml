tasks:
  - task_id: "coding_python_mutable_default_arg_bug"
    category: "Coding"
    sub_category: "Python"
    task_type: code_generation
    difficulty: easy
    response_scope: covers
    question: |
      The following Python function is intended to append an item to a list and return it.
      Identify and fix the bug.

      ```python
      def add_to_list(item, my_list=[]):
          my_list.append(item)
          return my_list
      ```
    golden_answer: |
      The bug is due to using a mutable default argument (`my_list=[]`).
      The default list persists between function calls, causing items to accumulate across calls.

      Correct fix:
      ```python
      def add_to_list(item, my_list=None):
          if my_list is None:
              my_list = []
          my_list.append(item)
          return my_list
      ```
    pass_criteria: "Recognizes that using a mutable default argument causes shared state between calls, and changes the default to None, initializing the list inside the function."
    fail_criteria: "Fails to identify the mutable default argument problem, changes unrelated parts of the code, or incorrectly claims the code works as intended."
    required_terms:
      exact:
        - "mutable default argument"
        - "my_list=None"
      semantic:
        - "shared state"
        - "default argument"
        - "initialize inside function"
      forbidden:
        - "my_list=[]"
