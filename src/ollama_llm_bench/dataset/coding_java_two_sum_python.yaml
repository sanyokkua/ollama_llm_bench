tasks:
  - task_id: "coding_java_two_sum_python"
    category: "Coding"
    sub_category: "Python"
    task_type: code_generation
    difficulty: medium
    response_scope: covers
    question: "Write a Python function that, given a list of integers and a target sum, returns the indices of two distinct elements whose values add up to the target. The solution must run in O(n) time and use O(n) extra space. Handle cases where no valid pair exists and where duplicate values are present."
    golden_answer: |
      def two_sum(nums, target):
          num_map = {}
          for i, num in enumerate(nums):
              complement = target - num
              if complement in num_map:
                  return [num_map[complement], i]
              num_map[num] = i
          return []  # or raise an exception if no solution
    pass_criteria: "Uses a dictionary to store visited elements and check complements in a single pass, ensuring O(n) time and O(n) space complexity. Correctly handles no-solution and duplicate cases."
    fail_criteria: "The solution uses nested loops (O(n²)), returns wrong indices, fails with duplicate numbers, or is not valid Python."
    required_terms:
      exact:
        - "num_map"
        - "enumerate"
        - "complement"
      semantic:
        - "dictionary lookup"
        - "single pass"
        - "O(n) time"
      forbidden:
        - "nested loop"
        - "for i in range"
        - "for j in range"
