tasks:
  - task_id: "text_operations_manipulations_conditional_omission_organic_adjectives"
    category: "Text Operations"
    sub_category: "Text Manipulation"
    task_type: text_rewrite
    difficulty: medium
    response_scope: contains
    question: |
      You will be given a product description. If the word 'organic' appears, remove all adjectives. If 'organic' does NOT appear, double all adjectives. Never add new words.
      Input: 'Our delicious, premium organic dark chocolate bar is amazingly smooth.'
    golden_answer: "Our dark chocolate bar is amazingly smooth."
    pass_criteria: "Output has no adjectives before 'dark chocolate bar' because 'organic' is present. The word 'organic' itself is removed. Core nouns and structure preserved."
    fail_criteria: "Adjectives not removed when 'organic' is present. Adjectives doubled when 'organic' is present. Added new words or changed the meaning."
    required_terms:
      exact:
        - "dark chocolate bar"
      semantic:
        - "adjectives removed"
      forbidden:
        - "delicious"
        - "premium"
        - "organic"
