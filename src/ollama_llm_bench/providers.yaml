embedding:
  model: bge-m3:567m
  provider_id: ollama_local
providers:
- api_key: ollama
  base_url: http://localhost:11434/v1
  default_models:
  - llama3.2:3b
  - mistral:7b
  - qwen2.5:7b
  enabled: true
  id: ollama_local
  label: Ollama (local)
  type: openai_compatible
- api_key: lm-studio
  base_url: http://localhost:1234/v1
  enabled: false
  id: lm_studio_local
  label: LM Studio (local)
  type: openai_compatible
- api_key: no-key
  base_url: http://localhost:8080/v1
  enabled: false
  id: llamacpp_local
  label: llama.cpp server (local)
  type: openai_compatible
- api_key: ${OPENAI_API_KEY}
  base_url: https://api.openai.com/v1
  default_models:
  - gpt-4o
  - gpt-4o-mini
  enabled: false
  id: openai
  label: OpenAI
  type: openai_compatible
- api_key: ${AZURE_OPENAI_API_KEY}
  enabled: false
  id: azure_openai
  label: Azure OpenAI
  type: openai_compatible
- api_key: ${ANTHROPIC_API_KEY}
  default_models:
  - claude-opus-4-6
  - claude-sonnet-4-6
  - claude-haiku-4-5-20251001
  enabled: false
  id: anthropic
  label: Anthropic
  type: anthropic
- api_key: ${GEMINI_API_KEY}
  default_models:
  - gemini-2.0-flash
  - gemini-1.5-pro
  enabled: false
  id: gemini
  label: Google Gemini
  type: gemini
