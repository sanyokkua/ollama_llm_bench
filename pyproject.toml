[project]
name = "ollama_llm_bench"
version = "0.1.1"
description = "Ollama benchmark"
authors = [
    { name = "Oleksandr Kostenko", email = "sanyokkua@gmail.com" }
]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pyqt6>=6.9.1,<7.0.0",
    "ollama>=0.5.1,<0.6.0",
    "pyyaml>=6.0.2,<7.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
ollama_llm_bench = "ollama_llm_bench.main:main"

[dependency-groups]
dev = [
    "pytest>=8.4.1",
    "pytest-mock>=3.12",
    "pytest-cov>=4.0",
    "ruff>=0.9.0",
    "mypy>=1.14.0",
    "pyright>=1.1.403",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ollama_llm_bench"]

[tool.hatch.build.targets.wheel.force-include]
"src/ollama_llm_bench/dataset" = "ollama_llm_bench/dataset"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = ["-q", "--tb=short", "--no-header", "-p no:warnings", "--import-mode=importlib", "--strict-markers", "--strict-config"]
log_cli = false
log_level = "WARNING"
log_cli_level = "WARNING"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
    "ignore::ResourceWarning",
]
markers = [
    "unit: Unit tests (fast, isolated)",
    "integration: Integration tests (require real resources)",
    "slow: Tests exceeding standard time budget",
]

[tool.ruff]
target-version = "py313"
line-length = 120
output-format = "concise"
exclude = [".venv", "__pycache__", ".mypy_cache", ".ruff_cache", "dist", "build"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "A", "C4", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/*" = ["S101"]

[tool.ruff.lint.isort]
known-first-party = ["ollama_llm_bench"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.13"
strict = true
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
show_error_codes = true
show_column_numbers = true
no_error_summary = true
pretty = false
concise_errors = true
incremental = true
cache_dir = ".mypy_cache"

[tool.coverage.run]
source = ["src"]
branch = true
omit = ["*/tests/*", "*/__init__.py"]

[tool.coverage.report]
fail_under = 80
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "@abstractmethod",
]
