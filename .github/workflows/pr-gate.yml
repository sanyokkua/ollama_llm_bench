name: PR Gate

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [master]

concurrency:
  group: pr-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  QT_QPA_PLATFORM: offscreen

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv python install 3.13.3
      - run: uv sync --frozen --all-extras --dev
      - run: uv run ruff check src tests scripts
      - run: uv run ruff format --check src tests scripts
      - run: uv run lint-imports
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Mermaid diagram lint
        run: uv run python scripts/lint_mermaid.py

  typecheck:
    name: Type-check
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv python install 3.13.3
      - run: uv sync --frozen --all-extras --dev
      - run: |
          uv run mypy --strict src \
            tests/architecture/test_gateway_protocol_assignability.py \
            tests/unit/test_common_dialog_gateway_structural_satisfaction.py
      - name: Negative typing tests must fail mypy
        run: |
          set +e
          uv run mypy --strict tests/typing_negative/
          if [ $? -eq 0 ]; then
            echo "ERROR: typing_negative tests unexpectedly passed mypy"
            exit 1
          fi
          echo "OK: typing_negative tests failed mypy as required"

  test:
    name: Test (${{ matrix.os }})
    needs: typecheck
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv python install 3.13.3
      - run: uv sync --frozen --all-extras --dev
      - name: Architecture tests
        run: uv run pytest tests/architecture -q
      - name: Unit + integration tests
        run: uv run pytest tests/unit tests/integration -q
      - name: Coverage (Linux only)
        if: matrix.os == 'ubuntu-latest'
        run: uv run pytest --cov=ollama_llm_bench --cov-report=term-missing
